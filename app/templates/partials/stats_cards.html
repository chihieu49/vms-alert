<!-- Stats Cards Component -->
<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4 mb-6" id="stats-cards-container">
    <!-- Card 1: Total Vessels -->
    <div class="bg-white rounded-xl p-5 border border-slate-200 shadow-sm flex items-center justify-between">
        <div>
            <div class="text-xs font-semibold text-slate-500 uppercase tracking-wider">Tổng Tàu Giám Sát</div>
            <div class="text-2xl font-bold text-slate-900 mt-1" id="stat-total">0</div>
            <div class="text-xs text-slate-400 mt-0.5">Chiều dài ≥ 15 mét</div>
        </div>
        <div class="w-12 h-12 rounded-xl bg-blue-50 text-blue-600 flex items-center justify-center text-xl">
            <i class="fa-solid fa-ship"></i>
        </div>
    </div>

    <!-- Card 2: Normal Vessels -->
    <div class="bg-white rounded-xl p-5 border border-slate-200 shadow-sm flex items-center justify-between">
        <div>
            <div class="text-xs font-semibold text-slate-500 uppercase tracking-wider">Vị Trí Bình Thường</div>
            <div class="text-2xl font-bold text-emerald-600 mt-1" id="stat-normal">0</div>
            <div class="text-xs text-emerald-600/80 mt-0.5">Tín hiệu trong vòng 2h</div>
        </div>
        <div class="w-12 h-12 rounded-xl bg-emerald-50 text-emerald-600 flex items-center justify-center text-xl">
            <i class="fa-solid fa-circle-check"></i>
        </div>
    </div>

    <!-- Card 3: Lost Signal Alert -->
    <div class="bg-white rounded-xl p-5 border border-red-200 shadow-sm flex items-center justify-between bg-red-50/20">
        <div>
            <div class="text-xs font-semibold text-red-600 uppercase tracking-wider">Mất Kết Nối > 2 Giờ</div>
            <div class="text-2xl font-bold text-red-600 mt-1" id="stat-lost">0</div>
            <div class="text-xs text-red-500 mt-0.5">Đã cảnh báo email</div>
        </div>
        <div class="w-12 h-12 rounded-xl bg-red-100 text-red-600 flex items-center justify-center text-xl animate-pulse">
            <i class="fa-solid fa-triangle-exclamation"></i>
        </div>
    </div>

    <!-- Card 4: Recovered (Discontinued) -->
    <div class="bg-white rounded-xl p-5 border border-slate-200 shadow-sm flex items-center justify-between">
        <div>
            <div class="text-xs font-semibold text-slate-500 uppercase tracking-wider">Đã Khắc Phục</div>
            <div class="text-2xl font-bold text-sky-600 mt-1" id="stat-recovered">0</div>
            <div class="text-xs text-sky-600/80 mt-0.5">Chấm dứt cảnh báo</div>
        </div>
        <div class="w-12 h-12 rounded-xl bg-sky-50 text-sky-600 flex items-center justify-center text-xl">
            <i class="fa-solid fa-shield-halved"></i>
        </div>
    </div>
</div>
